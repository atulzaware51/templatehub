<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Hub - Your One-Stop Solution</title>
    <style>
        /* (CSS omitted in this query for brevity) */
    </style>
</head>
<body>
    <!-- Topbar: Search + Trending -->
    <header style="background:var(--dark-bg); color:var(--white); position:sticky; top:0; z-index:1200; padding:12px 20px; display:flex; align-items:center; gap:16px;">
        <div style="font-weight:700; font-size:1.1rem;">Template<span style="color:var(--primary-color);">Hub</span></div>
        <div style="flex:1; display:flex; gap:8px; align-items:center;">
            <input id="searchInput" type="search" placeholder="Search templates, e.g. 'SaaS Landing'" style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid #ccc;" autocomplete="off">
            <div id="autocomplete" style="position:relative;"></div>
            <select id="sortSelect" style="padding:10px; border-radius:8px;">
                <option value="popular">Most Popular</option>
                <option value="newest">Newest</option>
                <option value="updated">Recently Updated</option>
                <option value="toprated">Top Rated</option>
            </select>
            <button id="openFiltersBtn" class="btn" style="background:transparent; border:1px solid rgba(255,255,255,0.08); color:var(--white);">Filters</button>
            <button id="openDashboardBtn" class="btn btn-primary">My Dashboard</button>
        </div>
        <div style="display:flex; gap:8px;">
            <button id="uploadBtn" class="btn">Submit</button>
        </div>
    </header>

    <main class="container" style="margin-top:18px; display:flex; gap:20px;">
        <!-- Filter Sidebar -->
        <aside id="filterSidebar" style="width:280px;">
            <div style="background:var(--white); padding:16px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.06);">
                <h3>Filters</h3>
                <div style="margin-top:8px;">
                    <label>Tech Stack</label>
                    <div id="filterTech" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
                </div>
                <div style="margin-top:12px;">
                    <label>Category</label>
                    <div id="filterCategory" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
                </div>
                <div style="margin-top:12px;">
                    <label>License</label>
                    <div id="filterLicense" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
                </div>
                <div style="margin-top:12px;">
                    <label>Style</label>
                    <div id="filterStyle" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
                </div>
                <div style="margin-top:12px; display:flex; gap:8px;">
                    <button id="clearFilters" class="btn btn-danger">Clear</button>
                    <button id="applyFilters" class="btn btn-primary">Apply</button>
                </div>
            </div>
            <div style="height:24px"></div>
            <div style="background:var(--white); padding:12px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.06);">
                <h4>Trending Searches</h4>
                <div id="trending" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
            </div>
        </aside>

        <!-- Grid -->
        <section style="flex:1;">
            <div id="gridHeader" style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Templates</h2>
                <div style="color:var(--text-light);">Showing <span id="resultsCount">0</span> results</div>
            </div>

            <div id="templateGrid" class="template-grid" style="margin-top:12px;"></div>
        </section>
    </main>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div style="position:sticky; top:0; background:#fff; display:flex; gap:8px; align-items:center; padding:8px; justify-content:space-between;">
                <div style="display:flex; gap:8px; align-items:center;">
                    <strong id="previewTitle"></strong>
                    <span id="previewMeta" style="color:#64748b; font-size:0.9rem;"></span>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <select id="deviceSelect">
                        <option value="desktop">Desktop</option>
                        <option value="tablet">Tablet</option>
                        <option value="mobile">Mobile</option>
                    </select>
                    <label style="display:flex; gap:6px; align-items:center;"><input type="checkbox" id="themeToggle">Dark</label>
                    <button id="openFullBtn" class="btn btn-primary">Remove Frame</button>
                    <button class="close-btn" onclick="closePreview()">×</button>
                </div>
            </div>
            <div id="previewHolder" style="padding:1rem; display:flex; justify-content:center;">
                <iframe id="previewIframe" style="width:100%; height:80vh; border:1px solid #e5e7eb; border-radius:8px;" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal" style="display:none;">
        <div class="modal-content" style="padding:16px; max-width:900px;">
            <button class="close-btn" onclick="closeDetails()">×</button>
            <div id="detailsBody"></div>
        </div>
    </div>

    <!-- Submission Modal -->
    <div id="submissionModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:700px; padding:16px;">
            <button class="close-btn" onclick="closeSubmission()">×</button>
            <h2>Submit a Template</h2>
            <div class="input-group"><label>Title</label><input id="subTitle" type="text"></div>
            <div class="input-group"><label>Repo URL (GitHub)</label><input id="subRepo" type="url"></div>
            <div class="input-group"><label>Tech Stack (comma)</label><input id="subTech" type="text"></div>
            <div class="input-group"><label>Category</label><input id="subCategory" type="text"></div>
            <div class="input-group"><label>License</label><select id="subLicense"><option>MIT</option><option>Creative Commons</option><option>Paid</option></select></div>
            <div class="input-group"><label>Thumbnail</label><input id="subThumb" type="file" accept="image/*"></div>
            <div style="display:flex; gap:8px;"><button id="submitTemplateBtn" class="btn btn-primary">Submit</button><button class="btn" onclick="closeSubmission()">Cancel</button></div>
        </div>
    </div>

    <!-- Dashboard Modal -->
    <div id="dashboardModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:900px; padding:16px;">
            <button class="close-btn" onclick="closeDashboard()">×</button>
            <h2>My Dashboard</h2>
            <div style="display:flex; gap:12px;">
                <div style="flex:1;">
                    <h3>Saved for Later</h3>
                    <div id="favList" class="item-list"></div>
                </div>
                <div style="flex:1;">
                    <h3>Download History</h3>
                    <div id="downloadHistory" class="item-list"></div>
                </div>
            </div>
        </div>
    </div>

    <footer style="padding:24px; text-align:center; color:var(--text-light);">&copy; 2026 Template Hub</footer>

    <script>
        /* Core styling variables used inline in this demo file. If you separate CSS, keep these variables. */
        const CSS_VARS = `:root{--primary-color:#6366f1; --secondary-color:#8b5cf6; --accent-color:#ec4899; --dark-bg:#0f172a; --light-bg:#f8fafc; --text-dark:#1e293b; --text-light:#64748b; --white:#ffffff; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;}`;
        // inject vars to document
        const styleEl = document.createElement('style'); styleEl.textContent = CSS_VARS; document.head.appendChild(styleEl);

        // Templates metadata (single source of truth for the grid). In a real app this would come from an API.
        const templatesData = [
            { id:'todo', title:'To-Do Tracker', tech:['HTML'], category:'Dashboard', license:'MIT', style:['Minimalist'], rating:4.6, popularity:1250, updated_at:'2026-01-19', created_at:'2025-12-01', previewHTML:`<body style='font-family:system-ui'><h1>To-Do Preview</h1><p>Simple task UI</p></body>`, screenshots:[], repo:'https://github.com/atulzaware51/templatehub', install:'git clone https://github.com/atulzaware51/templatehub.git && cd templatehub', fileTree:{'index.html':{}, 'css':{'main.css':{}}, 'js':{'app.js':{}}}, deps:['None - plain HTML']},
            { id:'health', title:'Health Tracker', tech:['Vue','Tailwind'], category:'Dashboard', license:'Creative Commons', style:['Corporate'], rating:4.2, popularity:870, updated_at:'2026-01-10', created_at:'2025-11-10', previewHTML:`<body style='font-family:system-ui'><h1>Health Tracker</h1><p>Health graphs & stats</p></body>`, screenshots:[], repo:'#', install:'npm i health-template', fileTree:{'index.html':{}, 'src':{'App.vue':{}}, 'package.json':{}}, deps:['Vue 3', 'Tailwind CSS']},
            { id:'medicine', title:'Medicine Tracker', tech:['React','Bootstrap'], category:'Dashboard', license:'MIT', style:['Minimalist'], rating:4.0, popularity:590, updated_at:'2026-01-08', created_at:'2025-09-20', previewHTML:`<body style='font-family:system-ui'><h1>Medicine Tracker</h1><p>Schedule & reminders</p></body>`, screenshots:[], repo:'#', install:'npx create-medicine', fileTree:{'README.md':{}, 'src':{'index.js':{}, 'App.js':{}}}, deps:['React 18', 'Bootstrap']},
            { id:'portfolio', title:'Portfolio Website', tech:['HTML','Tailwind'], category:'Portfolio', license:'MIT', style:['Minimalist','Dark Mode'], rating:4.8, popularity:2000, updated_at:'2026-01-20', created_at:'2025-06-12', previewHTML:`<body style='font-family:system-ui'><h1>Portfolio</h1><p>Showcase projects</p></body>`, screenshots:[], repo:'#', install:'git clone ...', fileTree:{'index.html':{}, 'assets':{}, 'projects':{}}, deps:['None - static']},
            { id:'gaming', title:'Gaming Website', tech:['HTML','JS','Bootstrap'], category:'Community', license:'Paid', style:['Brutalist'], rating:3.9, popularity:430, updated_at:'2025-12-01', created_at:'2025-05-02', previewHTML:`<body style='font-family:system-ui'><h1>Gaming Hub</h1><p>Events and leaderboard</p></body>`, screenshots:[], repo:'#', install:'purchase license', fileTree:{'index.html':{}, 'assets':{}}, deps:['None']},
            { id:'logo', title:'Logo Creator', tech:['HTML','Canvas'], category:'Tool', license:'MIT', style:['Minimalist'], rating:4.3, popularity:980, updated_at:'2026-01-05', created_at:'2025-08-10', previewHTML:`<body style='font-family:system-ui'><h1>Logo Editor</h1><p>Canvas demo</p></body>`, screenshots:[], repo:'#', install:'npm i logo-creator', fileTree:{'index.html':{}, 'canvas.js':{}}, deps:['None']}
        ];

        // localStorage keys
        const FAV_KEY = 'templatehub_favs';
        const DOWNLOAD_KEY = 'templatehub_downloads';
        const SUBMIT_KEY = 'templatehub_submissions';

        // Cached state
        let activeFilters = {tech: new Set(), category: new Set(), license: new Set(), style: new Set()};
        let currentSort = 'popular';

        // UI references
        const grid = document.getElementById('templateGrid');
        const resultsCount = document.getElementById('resultsCount');
        const searchInput = document.getElementById('searchInput');
        const autocomplete = document.getElementById('autocomplete');
        const trendingEl = document.getElementById('trending');

        // Trending queries
        const TRENDING = ['SaaS Landing Page','React Dashboard','Tailwind Portfolio','E-commerce'];

        // Render filter chips based on templatesData
        function initFilters() {
            const techSet = new Set();
            const catSet = new Set();
            const licSet = new Set();
            const styleSet = new Set();
            templatesData.forEach(t => { t.tech.forEach(x=>techSet.add(x)); catSet.add(t.category); licSet.add(t.license); (t.style||[]).forEach(x=>styleSet.add(x)); });

            buildFilterChips('filterTech', Array.from(techSet));
            buildFilterChips('filterCategory', Array.from(catSet));
            buildFilterChips('filterLicense', Array.from(licSet));
            buildFilterChips('filterStyle', Array.from(styleSet));

            document.getElementById('applyFilters').addEventListener('click', ()=>{ applyFilters(); renderGrid(); });
            document.getElementById('clearFilters').addEventListener('click', ()=>{ activeFilters = {tech:new Set(), category:new Set(), license:new Set(), style:new Set()}; document.querySelectorAll('#filterSidebar .chip.active').forEach(c=>c.classList.remove('active')); renderGrid(); });

            // trending
            TRENDING.forEach(t=>{ const b = document.createElement('button'); b.className='btn'; b.textContent = t; b.addEventListener('click',()=>{ searchInput.value=t; renderGrid(); }); trendingEl.appendChild(b); });
        }

        function buildFilterChips(containerId, items) {
            const parent = document.getElementById(containerId);
            items.forEach(i=>{
                const chip = document.createElement('button'); chip.className='chip'; chip.textContent = i; chip.addEventListener('click', ()=>{ chip.classList.toggle('active'); let key = containerId.replace('filter','').toLowerCase(); if (chip.classList.contains('active')) activeFilters[key].add(i); else activeFilters[key].delete(i); }); parent.appendChild(chip);
            });
        }

        // Search autocomplete (simple)
        searchInput.addEventListener('input', (e)=>{
            const v = e.target.value.toLowerCase(); autocomplete.innerHTML=''; if (!v) return;
            const matches = templatesData.filter(t=>t.title.toLowerCase().includes(v)).slice(0,6);
            const list = document.createElement('div'); list.style.background='#fff'; list.style.border='1px solid #e5e7eb'; list.style.position='absolute'; list.style.zIndex=1500; list.style.marginTop='4px'; list.style.padding='8px'; list.style.borderRadius='6px'; matches.forEach(m=>{ const li=document.createElement('div'); li.style.padding='6px'; li.style.cursor='pointer'; li.textContent=m.title; li.addEventListener('click',()=>{searchInput.value=m.title; autocomplete.innerHTML=''; renderGrid();}); list.appendChild(li); }); autocomplete.appendChild(list);
        });

        // Simple sort and filter pipeline
        function applyFilters() {
            // nothing extra to do: activeFilters used in render
        }

        function renderGrid() {
            const q = searchInput.value.trim().toLowerCase();
            let results = templatesData.filter(t=>{
                if (q) { if (!(t.title.toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q) || t.tech.join(' ').toLowerCase().includes(q))) return false; }
                if (activeFilters.tech.size && !t.tech.some(x=>activeFilters.tech.has(x))) return false;
                if (activeFilters.category.size && !activeFilters.category.has(t.category)) return false;
                if (activeFilters.license.size && !activeFilters.license.has(t.license)) return false;
                if (activeFilters.style.size && !(t.style||[]).some(x=>activeFilters.style.has(x))) return false;
                return true;
            });

            // sorting
            if (currentSort === 'popular') results.sort((a,b)=>b.popularity-a.popularity);
            else if (currentSort === 'newest') results.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            else if (currentSort === 'updated') results.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
            else if (currentSort === 'toprated') results.sort((a,b)=>b.rating-a.rating);

            grid.innerHTML='';
            results.forEach(t=>{
                const card = document.createElement('div'); card.className='template-card'; card.style.position='relative'; card.style.padding='12px'; card.style.borderRadius='12px'; card.style.cursor='pointer';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <div style="font-size:1.1rem; font-weight:700;">${escapeHtml(t.title)}</div>
                            <div style="color:var(--text-light); font-size:0.9rem;">${escapeHtml(t.category)} • ${escapeHtml(t.license)}</div>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            ${t.tech.map(tech=>`<span class="tech-badge" title="${tech}" style="background:rgba(0,0,0,0.05); padding:6px; border-radius:6px; font-size:0.8rem;">${tech}</span>`).join('')}
                        </div>
                    </div>
                    <p style="color:var(--text-light); margin-top:8px;">Rating: ${t.rating} • ${t.popularity} downloads</p>
                    <div style="position:absolute; right:12px; top:12px; display:flex; gap:8px;">
                        <button class="btn" data-action="preview" data-id="${t.id}">Preview</button>
                        <button class="btn" data-action="details" data-id="${t.id}">Details</button>
                        <button class="btn" data-action="fav" data-id="${t.id}">☆</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            resultsCount.textContent = results.length;

            // attach actions
            grid.querySelectorAll('[data-action="preview"]').forEach(b=>b.addEventListener('click',(e)=>{ openPreview(b.dataset.id); e.stopPropagation(); }));
            grid.querySelectorAll('[data-action="details"]').forEach(b=>b.addEventListener('click',(e)=>{ openDetails(b.dataset.id); e.stopPropagation(); }));
            grid.querySelectorAll('[data-action="fav"]').forEach(b=>b.addEventListener('click', (e)=>{ toggleFavorite(b.dataset.id); e.stopPropagation(); }));
        }

        // Favorites
        function getFavs(){ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }
        function toggleFavorite(id){ let favs = new Set(getFavs()); if (favs.has(id)) favs.delete(id); else favs.add(id); localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); renderGrid(); }

        // Preview
        const previewModal = document.getElementById('previewModal');
        const previewIframe = document.getElementById('previewIframe');
        const previewTitle = document.getElementById('previewTitle');
        const previewMeta = document.getElementById('previewMeta');
        document.getElementById('deviceSelect').addEventListener('change', (e)=>{ setPreviewDevice(e.target.value); });
        document.getElementById('themeToggle').addEventListener('change', (e)=>{ setPreviewTheme(e.target.checked ? 'dark' : 'light'); });
        document.getElementById('openFullBtn').addEventListener('click', ()=>{ window.open(currentPreviewWindowUrl || previewIframe.srcdoc || '', '_blank'); });

        let currentPreviewTemplate = null;
        let currentPreviewWindowUrl = null;

        function openPreview(id){ const t = templatesData.find(x=>x.id===id); if (!t) return; currentPreviewTemplate = t; previewTitle.textContent = t.title; previewMeta.textContent = \
 `${t.tech.join(', ')} • ${t.category}`; previewModal.style.display='block'; // inject preview into iframe via srcdoc
            // include basic reset and optionally theme toggling hooks
            const baseHTML = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:system-ui;padding:20px;} .dark-mode{background:#0f172a;color:#fff;} </style></head><body>${t.previewHTML}</body></html>`;
            previewIframe.srcdoc = baseHTML;
            setPreviewDevice(document.getElementById('deviceSelect').value);
        }
        function closePreview(){ previewModal.style.display='none'; previewIframe.srcdoc = ''; }
        function setPreviewDevice(d){ if (d==='desktop'){ previewIframe.style.width='100%'; previewIframe.style.height='80vh'; } else if (d==='tablet'){ previewIframe.style.width='900px'; previewIframe.style.height='70vh'; } else { previewIframe.style.width='420px'; previewIframe.style.height='80vh'; } }
        function setPreviewTheme(theme){ // inject a small script to toggle dark class if the template supports it
            if (!previewIframe.contentDocument) return; try { if (theme==='dark'){ previewIframe.contentDocument.body.classList.add('dark-mode'); } else previewIframe.contentDocument.body.classList.remove('dark-mode'); } catch(e){} }

        // Details
        function openDetails(id){ const t = templatesData.find(x=>x.id===id); if (!t) return; const body = document.getElementById('detailsBody'); let html = `<h2>${escapeHtml(t.title)}</h2><p style="color:var(--text-light);">${escapeHtml(t.category)} • ${escapeHtml(t.license)} • ${t.tech.join(', ')}</p>`;
            html += `<h3>Install</h3><div style="display:flex; gap:8px;"><code id="installCmd">${escapeHtml(t.install)}</code><button class="btn" id="copyInstallBtn">Copy</button></div>`;
            html += `<h3>Dependencies</h3><ul>${t.deps.map(d=>`<li>${escapeHtml(d)}</li>`).join('')}</ul>`;
            html += `<h3>File Structure</h3><div>${renderFileTree(t.fileTree)}</div>`;
            html += `<h3>Lighthouse (placeholder)</h3><p style="color:#64748b;">To populate Lighthouse scores integrate with Lighthouse CI or PageSpeed Insights API on your server and store results on the template record.</p>`;
            body.innerHTML = html; document.getElementById('detailsModal').style.display='block'; document.getElementById('copyInstallBtn').addEventListener('click', ()=>{ navigator.clipboard.writeText(t.install).then(()=>alert('Copied install command')); });
        }
        function closeDetails(){ document.getElementById('detailsModal').style.display='none'; }

        function renderFileTree(tree){ if (!tree) return '<em>No files available</em>'; let out = '<ul style="font-family:monospace;">'; for (const k in tree){ out += `<li>${escapeHtml(k)}`; if (Object.keys(tree[k]).length) out += renderFileTree(tree[k]); out += `</li>`; } out += '</ul>'; return out; }

        // Dashboard
        document.getElementById('openDashboardBtn').addEventListener('click', ()=>{ openDashboard(); });
        function openDashboard(){ const modal = document.getElementById('dashboardModal'); modal.style.display='block'; renderDashboard(); }
        function closeDashboard(){ document.getElementById('dashboardModal').style.display='none'; }
        function renderDashboard(){ const favList = document.getElementById('favList'); favList.innerHTML=''; const favs = getFavs(); favs.forEach(id=>{ const t = templatesData.find(x=>x.id===id); if (!t) return; const el=document.createElement('div'); el.className='item-card'; el.innerHTML = `<div><strong>${escapeHtml(t.title)}</strong><div style="color:#64748b">${escapeHtml(t.category)}</div></div><div style="display:flex; gap:8px;"><button class="btn" data-open="${t.id}">Open</button><button class="btn btn-danger" data-remove="${t.id}">Remove</button></div>`; favList.appendChild(el); el.querySelector('[data-open]')?.addEventListener('click',()=>{ openDetails(t.id); }); el.querySelector('[data-remove]')?.addEventListener('click',()=>{ toggleFavorite(t.id); renderDashboard(); }); });
            const downloads = JSON.parse(localStorage.getItem(DOWNLOAD_KEY)||'[]'); const hist = document.getElementById('downloadHistory'); hist.innerHTML=''; downloads.forEach(d=>{ const t = templatesData.find(x=>x.id===d.id); const el = document.createElement('div'); el.className='item-card'; el.innerHTML = `<div><strong>${t?escapeHtml(t.title):escapeHtml(d.id)}</strong><div style="color:#64748b">${d.at}</div></div><div><button class="btn" onclick="(function(){window.open('${d.url || '#'}','_blank')})()">Open</button></div>`; hist.appendChild(el); }); }

        // Submission
        document.getElementById('uploadBtn').addEventListener('click', ()=>{ document.getElementById('submissionModal').style.display='block'; });
        document.getElementById('submitTemplateBtn').addEventListener('click', ()=>{ const title = document.getElementById('subTitle').value.trim(); const repo = document.getElementById('subRepo').value.trim(); const tech = document.getElementById('subTech').value.split(',').map(s=>s.trim()).filter(Boolean); const category = document.getElementById('subCategory').value.trim(); const license = document.getElementById('subLicense').value; const thumb = document.getElementById('subThumb').files[0]; if (!title || !repo) { alert('Please fill title and repo URL'); return; } const submission = {id:'sub_'+Date.now(), title, repo, tech, category, license, thumbName: thumb?thumb.name:'', at: new Date().toISOString()}; const subs = JSON.parse(localStorage.getItem(SUBMIT_KEY)||'[]'); subs.push(submission); localStorage.setItem(SUBMIT_KEY, JSON.stringify(subs)); alert('Submitted (saved locally)'); closeSubmission(); });
        function closeSubmission(){ document.getElementById('submissionModal').style.display='none'; }

        // Utility
        function escapeHtml(unsafe){ return String(unsafe).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

        // basic interactions for the initial templates (To-Do & Medicine) that use existing localStorage keys. Keep earlier todo behavior but it's now embedded in templatesData previews for demo.

        // init
        initFilters(); renderGrid();

        // global handlers to close modals when clicking outside
        window.addEventListener('click', (e)=>{ ['previewModal','detailsModal','submissionModal','dashboardModal'].forEach(id=>{ const el = document.getElementById(id); if (el && el.style.display==='block' && e.target===el) el.style.display='none'; }); });

        // sort handler
        document.getElementById('sortSelect').addEventListener('change', (e)=>{ currentSort = e.target.value; renderGrid(); });

        // preview close helper
        function closePreview(){ document.getElementById('previewModal').style.display='none'; }

        // small helper when downloading (for download history)
        function recordDownload(id, url){ const hist = JSON.parse(localStorage.getItem(DOWNLOAD_KEY)||'[]'); hist.unshift({id, at:new Date().toLocaleString(), url}); localStorage.setItem(DOWNLOAD_KEY, JSON.stringify(hist)); }

    </script>
</body>
</html>
